<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite Carousel Animation</title>

    <style>
      body {
        font-family: Roboto, Helvetica, sans-serif;
      }

      h1 {
        font-size: 32px;
        text-align: center;
        text-decoration: underline;
        padding-top: 32px;
      }

      .carousel {
        margin: 100px auto;
        display: flex;

        overflow-x: auto;
      }

      .coloured .card {
        background-color: pink;
      }

      .carousel::-webkit-scrollbar {
        display: none;
      }

      .carousel:hover .group {
        animation-play-state: paused;
      }

      .group {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1em;
        padding-right: 1em;

        animation: spin 10s infinite linear;
      }

      .card {
        flex: 0 0 4em;
        height: 3em;
        padding: 1em;
        /* background-color: cornflowerblue; */
        font-size: 2em;
        border-radius: 0.4em;
        text-align: center;
        align-content: center;
      }

      .card img {
        width: 100%;
      }

      @keyframes spin {
        from {
          translate: 0;
        }
        to {
          translate: -100%;
        }
      }
    </style>
  </head>
  <body>
    <h1>Infinite Carousel</h1>

    <div class="carousel coloured">
      <div class="group">
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>
        <div class="card">4</div>
        <div class="card">5</div>
      </div>
      <div aria-hidden="true" class="group">
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>
        <div class="card">4</div>
        <div class="card">5</div>
      </div>
    </div>

    <div class="carousel">
      <div class="group">
        <div class="card"><img src="./assets/logos/1.svg" /></div>
        <div class="card"><img src="./assets/logos/2.svg" /></div>
        <div class="card"><img src="./assets/logos/3.svg" /></div>
        <div class="card"><img src="./assets/logos/4.svg" /></div>
        <div class="card"><img src="./assets/logos/5.svg" /></div>
      </div>
      <div aria-hidden="true" class="group">
        <div class="card"><img src="./assets/logos/1.svg" /></div>
        <div class="card"><img src="./assets/logos/2.svg" /></div>
        <div class="card"><img src="./assets/logos/3.svg" /></div>
        <div class="card"><img src="./assets/logos/4.svg" /></div>
        <div class="card"><img src="./assets/logos/5.svg" /></div>
      </div>
    </div>
  </body>
</html>
