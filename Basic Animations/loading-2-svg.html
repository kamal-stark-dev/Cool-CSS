<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Loading</title>

    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;

        height: 100vh;
        background-color: #111;
      }

      .loader svg circle:nth-child(1) {
        animation: dotPulse 1.6s ease 0s infinite;
      }

      .loader svg circle:nth-child(2) {
        animation: dotPulse 1.6s ease 0.2s infinite;
      }

      .loader svg circle:nth-child(3) {
        animation: dotPulse 1.6s ease 0.4s infinite;
      }

      @keyframes dotPulse {
        0%,
        80%,
        100% {
          r: 6;
          opacity: 0.3;
        }

        40% {
          r: 9;
          opacity: 0.9;
        }
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <svg width="150" height="70" viewBox="0 0 80 30">
        <circle cx="15" cy="15" r="" fill="#5478FF" />
        <circle cx="40" cy="15" r="" fill="#5478FF" />
        <circle cx="65" cy="15" r="" fill="#5478FF" />
      </svg>
    </div>
  </body>
</html>
