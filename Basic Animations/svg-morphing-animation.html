<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Morphing Animation</title>

    <style>
      body {
        background-color: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #999595;
        font-family: Arial, Helvetica, sans-serif;
      }

      p {
        width: 290px;
        text-align: center;
      }

      .morph {
        animation: morph 3s ease-in-out infinite;
      }

      @keyframes morph {
        0%,
        100% {
          d: path("M 80,20 L 140,70 L 120,140 L 40,140 L 20,70 Z");
          fill: #ff6b6b;
        }

        50% {
          d: path("M 80,10 L 150,10 L 130,150 L 30,150 L 10,10 Z");
          fill: #a78bfa;
        }
      }
    </style>
  </head>
  <body>
    <svg width="300" viewbox="0 0 160 160">
      <path class="morph" d="M 80,20 L 140,70 L 120,140 L 40,140 L 20,70 Z" />
    </svg>
    <p>
      Make sure that you have same number of points for smoother morph
      animation.
    </p>
  </body>
</html>
