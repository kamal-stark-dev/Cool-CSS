<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox and Grid Tricks</title>
    <link rel="stylesheet" href="./global_styles.css" />
    <link rel="stylesheet" href="./01_styles.css" />
  </head>
  <body>
    <main>
      <h1>Flexbox and Grid Tricks</h1>

      <hr />
      <h2>1. Isolating elements in a Flexbox.</h2>
      <ul class="navbar one">
        <li>Home</li>
        <li>Products</li>
        <li>About</li>
        <li>Pricing</li>
        <li>Login</li>
      </ul>
      <ul class="navbar two">
        <li>Home</li>
        <li>Products</li>
        <li>About</li>
        <li>Pricing</li>
        <li>Login</li>
      </ul>

      <hr />
      <h2>2. Making flexible grids (grid-template-areas)</h2>

      <p>Example 1:</p>
      <div class="grid-container one">
        <div class="one">Navbar</div>
        <div class="two">Sidebar</div>
        <div class="three">Main</div>
      </div>

      <p>Example 2:</p>
      <div class="grid-container two">
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>
        <div class="card">4</div>
        <div class="card">5</div>
        <div class="card">6</div>
        <div class="card">7</div>
      </div>
    </main>
  </body>
</html>
